regions:
  harbin:
    name: "哈尔滨新区"
    patches_meta: "/data/harbin/patches_meta.json"
    embeddings:
      v2: "/data/harbin/embeddings/v2"
    tasks:
      change_detection:
        name: "变化检测"
        description: "基于两期 embedding 差分的变化检测"
        embedding_version: "v2"
        versions:
          v1:
            results: "/data/harbin/results/change_detection"
            labels: "/data/harbin/labels/change_detection"
      building_extraction:
        name: "建筑物提取"
        description: "建筑物提取与建筑工地监测"
        versions:
          v1:
            results: "/data/harbin/results/construction"
            predictions: "/data/harbin/predictions/construction"
            labels: "/data/harbin/labels/construction"
          v2:
            results: "/data/harbin/results_v2/construction"
            predictions: "/data/harbin/predictions/construction"
            labels: "/data/harbin/labels_v2/construction"
      land_use_classification:
        name: "土地利用分类"
        description: "土地利用分类与转换监测"
        versions:
          v1:
            results: "/data/harbin/results/farmland"
            predictions: "/data/harbin/predictions/farmland"
            labels: "/data/harbin/labels/farmland"
          v2:
            results: "/data/harbin/results_v2/land_conversion"
            predictions: "/data/harbin/predictions_v2/land_conversion"
            labels: "/data/harbin/labels_v2/land_conversion"
      land_cover_classification:
        name: "土地覆盖分类"
        description: "土地覆盖分类（基于预训练 Linear Probe，结果需实时推理）"
        versions: {}
      water_extraction:
        name: "水体提取"
        description: "水体提取（基于预训练 Linear Probe，结果需实时推理）"
        versions: {}

  haidian:
    name: "海淀区"
    patches_meta: "/data/haidian/patches_meta_v2.json"
    embeddings:
      aef: "/data/haidian/aef_embeddings/haidian_2025_patches"
      cache: "/data/embeddings_cache/olmoearth"
      viz: "/data/haidian/viz_multi_source"
    tasks:
      change_detection:
        name: "变化检测"
        description: "基于两期 embedding 差分的变化检测"
        versions: {}
      building_extraction:
        name: "建筑物提取"
        description: "建筑物提取"
        versions: {}
      land_use_classification:
        name: "土地利用分类"
        description: "土地利用分类"
        versions: {}
      land_cover_classification:
        name: "土地覆盖分类"
        description: "土地覆盖分类"
        versions: {}
      water_extraction:
        name: "水体提取"
        description: "水体提取"
        versions: {}
