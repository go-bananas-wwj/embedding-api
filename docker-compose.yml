version: "3.8"

services:
  embedding-api:
    build: .
    container_name: embedding-api
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      # Mount data directories (adjust paths as needed)
      - /workspace/projects/xuannv-show/data/harbin:/data/harbin:ro
      - /workspace/projects/olmo/data/haidian:/data/haidian:ro
      - /workspace/projects/olmo/embeddings_cache:/data/embeddings_cache:ro
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
