# System-level downstream models (not region-specific)
models:
  change_detection:
    name: "变化检测"
    description: "系统级两期 embedding 差分变化检测 (ChangeDetectionHeadV3)"
    path: "models/system/change_detection/monthly_cd_head_v5_final.pt"
    type: "pytorch"
  classification:
    name: "地物分类"
    description: "基于 Linear Probe 的地物分类模型集合"
    path: "models/system/classification"
    type: "sklearn"
    tasks:
      worldcover:
        file: "worldcover_linear_probe.pkl"
        classes: 11
      dynamic_world:
        file: "dynamic_world_linear_probe.pkl"
        classes: 10
      jrc_water:
        file: "jrc_water_linear_probe.pkl"
        classes: 2
      building_extraction:
        file: "building_linear_probe.pkl"
        classes: 2

regions:
  harbin:
    name: "哈尔滨新区"
    patches_meta: "data/harbin/patches_meta.json"
    embeddings:
      v1:
        path: "data/harbin/embeddings/v1"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
      v2:
        path: "data/harbin/embeddings/v2"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
    tasks:
      construction:
        name: "建筑工地监测"
        description: "监测建筑工地变化情况"
        versions:
          v1:
            results: "data/harbin/tasks/construction/v1/results"
            predictions: "data/harbin/tasks/construction/v1/predictions"
            labels: "data/harbin/tasks/construction/v1/labels"
          v2:
            results: "data/harbin/tasks/construction/v2/results"
            predictions: "data/harbin/tasks/construction/v2/predictions"
            labels: "data/harbin/tasks/construction/v2/labels"
      building_change:
        name: "建筑变化监测"
        description: "监测建筑物变化情况"
        versions:
          v1:
            results: "data/harbin/tasks/building_change/v1/results"
            predictions: "data/harbin/tasks/building_change/v1/predictions"
            labels: "data/harbin/tasks/building_change/v1/labels"
      farmland:
        name: "耕地非农非粮监测"
        description: "监测耕地被非法占用情况"
        versions:
          v1:
            results: "data/harbin/tasks/farmland/v1/results"
            predictions: "data/harbin/tasks/farmland/v1/predictions"
            labels: "data/harbin/tasks/farmland/v1/labels"
      land_conversion:
        name: "土地转换监测"
        description: "监测土地用途转换情况"
        versions:
          v2:
            results: "data/harbin/tasks/land_conversion/v2/results"
            predictions: "data/harbin/tasks/land_conversion/v2/predictions"
            labels: "data/harbin/tasks/land_conversion/v2/labels"
      change_detection:
        name: "变化检测"
        description: "系统级两期 embedding 差分变化检测"
        model: "change_detection"
        versions:
          v1:
            results: "data/harbin/tasks/change_detection/v1/results"
            labels: "data/harbin/tasks/change_detection/v1/labels"

  haidian:
    name: "海淀区"
    patches_meta: "data/haidian/patches_meta_v2.json"
    embeddings:
      v1:
        path: "data/haidian/embeddings/v1"
        template: "{patch_id}/patch_{patch_id}_{month}.npz"
        formats: ["npz", "png", "json"]
    tasks: {}
