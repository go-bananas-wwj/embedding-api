sam3:
  model_path: "models/sam3/sam3.pt"
  bpe_path: "models/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  device: "cuda"
  max_cache_size: 20
  image_size: 256
  # High-resolution optical input keeps its aspect ratio and is only reduced
  # when the longest side exceeds this value.
  highres_image_size: 1024
  enable_inst_interactivity: true

# Downstream task models organized by region and version (aligned with API v1/v2)
models:
  harbin:
    v1:
      change_detection:
        name: "变化检测"
        description: "基于 V4 embedding 的两期差分变化检测"
        path: "models/harbin/v1/change_detection/monthly_cd_head_v3_ohem.pt"
        type: "pytorch"
      classification:
        name: "地物分类 (Linear Probe)"
        description: "V4 线性分类探针"
        path: "models/harbin/v1/linear_probe"
        type: "sklearn"
        tasks:
          worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
          dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
          jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
          osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
      classification_convhead:
        name: "地物分类 (ConvHead)"
        description: "V4 轻量卷积分类头"
        path: "models/harbin/v1/convhead"
        type: "pytorch"
        tasks:
          worldcover: {file: "worldcover_convhead.pt", classes: 11}
          dynamic_world: {file: "dynamic_world_convhead.pt", classes: 10}
          jrc_water: {file: "jrc_water_convhead.pt", classes: 2}
          osm_buildings: {file: "osm_buildings_convhead.pt", classes: 2}
    v2:
      change_detection:
        name: "变化检测"
        description: "基于 V5 embedding 的两期差分变化检测"
        path: "models/harbin/v2/change_detection/monthly_cd_head_v5_final.pt"
        type: "pytorch"
      classification:
        name: "地物分类 (Linear Probe)"
        description: "V5 线性分类探针"
        path: "models/harbin/v2/linear_probe"
        type: "sklearn"
        tasks:
          worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
          dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
          jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
          osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
      classification_v2:
        name: "地物分类 (Linear Probe v2)"
        description: "V5 线性分类探针第二版"
        path: "models/harbin/v2/linear_probe_v2"
        type: "sklearn"
        tasks:
          worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
          dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
          jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
          osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
      classification_convhead:
        name: "地物分类 (ConvHead)"
        description: "V5 轻量卷积分类头"
        path: "models/harbin/v2/convhead"
        type: "pytorch"
        tasks:
          worldcover: {file: "worldcover_convhead.pt", classes: 11}
          dynamic_world: {file: "dynamic_world_convhead.pt", classes: 10}
          jrc_water: {file: "jrc_water_convhead.pt", classes: 2}
          osm_buildings: {file: "osm_buildings_convhead.pt", classes: 2}
  haidian:
    v1:
      embedding:
        name: "海淀区 V1 嵌入模型"
        description: "来自 ModelScope WeijieWu/xuannv_haidian_embdding 的海淀区 202512-202605 embedding"
        path: "models/haidian/v1/embedding/haidian_embedding_v1_p10c_epoch800.pt"
        type: "pytorch"
      task_heads:
        name: "海淀区 V1 下游任务头"
        description: "来自最新海淀 V1 embedding 的建筑、道路和水体 MLP 下游任务头"
        path: "models/haidian/v1/task_heads"
        type: "pytorch"
        tasks:
          building_extraction: {head: "mlp", file: "building_mlp_fold0_best.pt", classes: 2}
          road_extraction: {head: "mlp", file: "road_mlp_fold0_best.pt", classes: 2}
          water_extraction: {head: "mlp", file: "water_mlp_fold0_best.pt", classes: 2}

regions:
  harbin:
    name: "哈尔滨新区"
    patches_meta: "data/harbin/patches_meta.json"
    s2_dir: "/workspace/data/raw/harbin_scenes/s2"
    embeddings:
      v1:
        path: "data/harbin/embeddings/v1"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
      v2:
        path: "data/harbin/embeddings/v2"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
    tasks:
      change_detection:
        name: "变化检测"
        description: "基于两期 embedding 差分的变化检测"
        # embedding_version indicates which embedding model (v1=V4, v2=V5) this task uses.
        # Task results are still stored under versions.v1 because they use the flat file layout.
        embedding_version: "v2"
        versions:
          v1:
            results: "data/harbin/tasks/change_detection/v1/results"
            labels: "data/harbin/tasks/change_detection/v1/labels"
      building_extraction:
        name: "建筑物提取"
        description: "建筑物提取与建筑工地监测（映射原 construction 任务）"
        versions:
          v1:
            results: "data/harbin/tasks/construction/v1/results"
            predictions: "data/harbin/tasks/construction/v1/predictions"
            labels: "data/harbin/tasks/construction/v1/labels"
          v2:
            results: "data/harbin/tasks/construction/v2/results"
            predictions: "data/harbin/tasks/construction/v2/predictions"
            labels: "data/harbin/tasks/construction/v2/labels"
      road_extraction:
        name: "道路提取"
        description: "基于 OpenStreetMap 路网数据栅格化的道路提取"
        versions:
          v1:
            results: "data/harbin/tasks/road_extraction/v1/results"
      land_use_classification:
        name: "土地利用分类"
        description: "土地利用分类与转换监测（映射原 farmland / land_conversion 任务）"
        versions:
          v1:
            results: "data/harbin/tasks/farmland/v1/results"
            predictions: "data/harbin/tasks/farmland/v1/predictions"
            labels: "data/harbin/tasks/farmland/v1/labels"
          v2:
            results: "data/harbin/tasks/land_conversion/v2/results"
            predictions: "data/harbin/tasks/land_conversion/v2/predictions"
            labels: "data/harbin/tasks/land_conversion/v2/labels"
      land_cover_classification:
        name: "土地覆盖分类"
        description: "土地覆盖分类（基于预训练 Linear Probe，结果需实时推理）"
        versions: {}
      water_extraction:
        name: "水体提取"
        description: "水体提取（基于预训练 Linear Probe，结果需实时推理）"
        versions: {}

  haidian:
    name: "海淀区"
    patches_meta: "data/haidian/patches_meta_v1.json"
    s2_dir: "data/haidian/archive/processed_training_data/extracted/patches/s2"
    highres_dir: "data/haidian/archive/processed_training_data/extracted/patches/highres_optical"
    embeddings:
      v1:
        path: "data/haidian/embeddings/v1"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
    tasks:
      building_extraction:
        name: "建筑物提取"
        description: "基于海淀 V1 embedding 的 OSM 建筑物提取"
        versions:
          v1:
            results: "data/haidian/tasks/building_extraction/v1/results"
            predictions: "data/haidian/tasks/building_extraction/v1/predictions"
            labels: "data/haidian/tasks/building_extraction/v1/labels"
      road_extraction:
        name: "道路提取"
        description: "基于海淀 V1 embedding 的 OSM 路网提取"
        versions:
          v1:
            results: "data/haidian/tasks/road_extraction/v1/results"
            predictions: "data/haidian/tasks/road_extraction/v1/predictions"
            labels: "data/haidian/tasks/road_extraction/v1/labels"
      construction:
        name: "施工地检测"
        description: "基于海淀 V1 OSM-assisted 诊断图的施工地检测（原 construction_site_extraction）"
        versions:
          v1:
            results: "data/haidian/tasks/construction/v1/results"
            predictions: "data/haidian/tasks/construction/v1/predictions"
            labels: "data/haidian/tasks/construction/v1/labels"
      land_use_classification:
        name: "土地利用分类"
        description: "海淀区 V1 月度土地利用分类 (Dynamic World Linear Probe)"
        versions:
          v1:
            results: "data/haidian/tasks/land_use_classification/v1/results"
            predictions: "data/haidian/tasks/land_use_classification/v1/predictions"
            labels: "data/haidian/tasks/land_use_classification/v1/labels"
      land_cover_classification:
        name: "土地覆盖分类"
        description: "海淀区 V1 月度土地覆盖分类 (WorldCover Linear Probe)"
        versions:
          v1:
            results: "data/haidian/tasks/land_cover_classification/v1/results"
            predictions: "data/haidian/tasks/land_cover_classification/v1/predictions"
            labels: "data/haidian/tasks/land_cover_classification/v1/labels"
      water_extraction:
        name: "水体提取"
        description: "基于海淀 V1 OSM-assisted 诊断图的水体提取"
        versions:
          v1:
            results: "data/haidian/tasks/water_extraction/v1/results"
            predictions: "data/haidian/tasks/water_extraction/v1/predictions"
            labels: "data/haidian/tasks/water_extraction/v1/labels"
