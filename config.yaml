# System-level downstream models (not region-specific)
# Downloaded from ModelScope dataset WeijieWu/xuannv_embddings
models:
  change_detection_v4:
    name: "变化检测 (V4)"
    description: "基于 V4 embedding 的两期差分变化检测"
    path: "models/system/v4/change_detection/monthly_cd_head_v3_ohem.pt"
    type: "pytorch"
  change_detection_v5:
    name: "变化检测 (V5)"
    description: "基于 V5 embedding 的两期差分变化检测 (推荐)"
    path: "models/system/v5/change_detection/monthly_cd_head_v5_final.pt"
    type: "pytorch"
  classification_v4_linear:
    name: "地物分类 (V4 Linear Probe)"
    description: "V4 线性分类探针"
    path: "models/system/v4/linear_probe"
    type: "sklearn"
    tasks:
      worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
      dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
      jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
      osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
  classification_v4_convhead:
    name: "地物分类 (V4 ConvHead)"
    description: "V4 轻量卷积分类头"
    path: "models/system/v4/convhead"
    type: "pytorch"
    tasks:
      worldcover: {file: "worldcover_convhead.pt", classes: 11}
      dynamic_world: {file: "dynamic_world_convhead.pt", classes: 10}
      jrc_water: {file: "jrc_water_convhead.pt", classes: 2}
      osm_buildings: {file: "osm_buildings_convhead.pt", classes: 2}
  classification_v5_linear:
    name: "地物分类 (V5 Linear Probe)"
    description: "V5 线性分类探针"
    path: "models/system/v5/linear_probe"
    type: "sklearn"
    tasks:
      worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
      dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
      jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
      osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
  classification_v5_linear_v2:
    name: "地物分类 (V5 Linear Probe v2)"
    description: "V5 线性分类探针第二版"
    path: "models/system/v5/linear_probe_v2"
    type: "sklearn"
    tasks:
      worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
      dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
      jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
      osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}
  classification_v5_convhead:
    name: "地物分类 (V5 ConvHead)"
    description: "V5 轻量卷积分类头"
    path: "models/system/v5/convhead"
    type: "pytorch"
    tasks:
      worldcover: {file: "worldcover_convhead.pt", classes: 11}
      dynamic_world: {file: "dynamic_world_convhead.pt", classes: 10}
      jrc_water: {file: "jrc_water_convhead.pt", classes: 2}
      osm_buildings: {file: "osm_buildings_convhead.pt", classes: 2}
  # Backward-compatible aliases (default to V5)
  change_detection:
    name: "变化检测"
    description: "系统级两期 embedding 差分变化检测 (ChangeDetectionHeadV3)"
    path: "models/system/v5/change_detection/monthly_cd_head_v5_final.pt"
    type: "pytorch"
  classification:
    name: "地物分类"
    description: "基于 Linear Probe 的地物分类模型集合 (V5)"
    path: "models/system/v5/linear_probe"
    type: "sklearn"
    tasks:
      worldcover: {file: "worldcover_linear_probe.pkl", classes: 11}
      dynamic_world: {file: "dynamic_world_linear_probe.pkl", classes: 10}
      jrc_water: {file: "jrc_water_linear_probe.pkl", classes: 2}
      osm_buildings: {file: "osm_buildings_linear_probe.pkl", classes: 2}

regions:
  harbin:
    name: "哈尔滨新区"
    patches_meta: "data/harbin/patches_meta.json"
    embeddings:
      v1:
        path: "data/harbin/embeddings/v1"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
      v2:
        path: "data/harbin/embeddings/v2"
        template: "{month}/{patch_id}.{fmt}"
        formats: ["npy", "png", "json"]
        alt_templates: ["{month}/{patch_id}.png"]
    tasks:
      construction:
        name: "建筑工地监测"
        description: "监测建筑工地变化情况"
        versions:
          v1:
            results: "data/harbin/tasks/construction/v1/results"
            predictions: "data/harbin/tasks/construction/v1/predictions"
            labels: "data/harbin/tasks/construction/v1/labels"
          v2:
            results: "data/harbin/tasks/construction/v2/results"
            predictions: "data/harbin/tasks/construction/v2/predictions"
            labels: "data/harbin/tasks/construction/v2/labels"
      building_change:
        name: "建筑变化监测"
        description: "监测建筑物变化情况"
        versions:
          v1:
            results: "data/harbin/tasks/building_change/v1/results"
            predictions: "data/harbin/tasks/building_change/v1/predictions"
            labels: "data/harbin/tasks/building_change/v1/labels"
      farmland:
        name: "耕地非农非粮监测"
        description: "监测耕地被非法占用情况"
        versions:
          v1:
            results: "data/harbin/tasks/farmland/v1/results"
            predictions: "data/harbin/tasks/farmland/v1/predictions"
            labels: "data/harbin/tasks/farmland/v1/labels"
      land_conversion:
        name: "土地转换监测"
        description: "监测土地用途转换情况"
        versions:
          v2:
            results: "data/harbin/tasks/land_conversion/v2/results"
            predictions: "data/harbin/tasks/land_conversion/v2/predictions"
            labels: "data/harbin/tasks/land_conversion/v2/labels"
      change_detection:
        name: "变化检测"
        description: "系统级两期 embedding 差分变化检测"
        model: "change_detection"
        versions:
          v1:
            results: "data/harbin/tasks/change_detection/v1/results"
            labels: "data/harbin/tasks/change_detection/v1/labels"

  haidian:
    name: "海淀区"
    patches_meta: "data/haidian/patches_meta_v2.json"
    embeddings:
      v1:
        path: "data/haidian/embeddings/v1"
        template: "{patch_id}/patch_{patch_id}_{month}.npz"
        formats: ["npz", "png", "json"]
    tasks: {}
